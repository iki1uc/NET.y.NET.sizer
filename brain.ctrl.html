        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@600;800&display=swap');
        :root{
          --bg: #02060a;
          --cyan: #00ccff;
          --lime: #39ff88;
          --gold: #ffd700;
          --pink: #ff5a5f;
          --mantis: #ff5fd2;
          --panel: #0a141e;
          --border: #123040;
          --text: #cfefff;
          --dim: #6a8fa3;
        }
        *{font-family: 'JetBrains Mono', monospace;}
        .syne{font-family: 'Syne', sans-serif;}
        body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden;}
        .scanlines{
          position:fixed;inset:0;pointer-events:none;z-index:50;
          background: repeating-linear-gradient(0deg, rgba(0,204,255,0.03) 0px, rgba(0,204,255,0.03) 1px, transparent 2px, transparent 4px);
        }
        .grid3{
          display:grid;grid-template-columns: 1.05fr 1.2fr 1.05fr;gap:14px;
          padding:14px;min-height:100vh;align-items:start;
        }
        @media(max-width:980px){ .grid3{grid-template-columns:1fr;}}
        .panel{
          background: linear-gradient(180deg, rgba(10,20,30,0.95), rgba(6,12,18,0.98));
          border:1px solid var(--border);
          box-shadow: inset 0 0 0 1px rgba(0,204,255,0.08), 0 0 24px rgba(0,204,255,0.06);
          position:relative;overflow:hidden;
        }
        .panel::before{
          content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg, transparent, var(--cyan), transparent);opacity:0.6;
        }
        .hdr{font-size:10px;letter-spacing:0.18em;color:var(--cyan);opacity:0.9;display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px dashed rgba(0,204,255,0.2);}
        .eye-shell{
          width: 220px;height:220px;margin:18px auto;position:relative;
          border-radius:50%;background: radial-gradient(ellipse at 35% 30%, #1a2a3a 0%, #060d14 55%, #000 100%);
          border:1px solid var(--cyan);box-shadow: 0 0 40px rgba(0,204,255,0.25), inset 0 0 20px rgba(255,95,210,0.15);
          overflow:hidden;cursor:crosshair;
        }
        .eye-iris{
          position:absolute;width:92px;height:92px;left:50%;top:50%;border-radius:50%;
          background: radial-gradient(circle at 30% 30%, var(--mantis) 0%, #8a2a6a 28%, #0a0a1a 62%);
          box-shadow: 0 0 18px var(--mantis);
          transition: transform 0.08s linear;
        }
        .eye-pupil{
          position:absolute;width:28px;height:28px;left:50%;top:50%;border-radius:50%;background:#000;
          box-shadow: 0 0 0 3px rgba(0,204,255,0.3), inset 0 0 8px var(--cyan);
        }
        .eye-pupil::after{content:'';position:absolute;width:8px;height:8px;background:white;border-radius:50%;left:6px;top:5px;opacity:0.9;}
        .eye-lid{
          position:absolute;left:0;right:0;height:50%;background:var(--bg);z-index:3;transition: transform 0.12s ease;
        }
        .eye-lid.top{top:0;transform-origin:top;}
        .eye-lid.bot{bottom:0;transform-origin:bottom;}
        .eye-shell.blink .eye-lid.top{transform: scaleY(1.02);}
        .eye-shell.blink .eye-lid.bot{transform: scaleY(1.02);}
        .eye-shell.blink{height:22px;filter: brightness(1.3);}
        .file-row{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;font-size:11px;border-bottom:1px solid rgba(0,204,255,0.07);}
